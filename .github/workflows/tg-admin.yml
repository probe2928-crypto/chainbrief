name: 텔레그램 채널 운영 (구독자·브리프)
# 매일 2번: 구독자 수 기록 + 데일리 브리프 (中文 08:20 홍콩 / English 12:20 UTC)
# 수동: cmd = setup(채널 이름·소개글·환영 글 고정) / count / briefing / brief-en / brief-zh
# 글로벌 브리핑: content/briefing/** 가 main에 push되면 바로 게시 (AI 글로벌 브리핑 데스크가 커밋)
on:
  push:
    branches: [main]
    paths: ["content/briefing/**", "content/column/**"]
  workflow_dispatch:
    inputs:
      cmd:
        description: "setup / count / invites / briefing / column-edit / brief-en / brief-zh"
        required: true
        default: count
  schedule:
    - cron: "20 0 * * *"
    - cron: "20 12 * * *"

permissions:
  contents: write

concurrency: { group: telegram, cancel-in-progress: false }

jobs:
  tg:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: 실행
        run: |
          C="${{ github.event.inputs.cmd }}"
          if [ "${{ github.event_name }}" = "push" ] || [ "$C" = "briefing" ]; then
            node scripts/fetch-macro.mjs || true
            node scripts/tg-admin.mjs briefing
          elif [ -z "$C" ]; then
            node scripts/tg-admin.mjs count
            if [ "$(date -u +%H)" = "00" ]; then node scripts/tg-admin.mjs brief zh; else node scripts/tg-admin.mjs brief en; fi
          else
            case "$C" in brief-*) node scripts/tg-admin.mjs brief "${C#brief-}";; *) node scripts/tg-admin.mjs "$C";; esac
            node scripts/tg-admin.mjs count
          fi
      - name: 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/tg-members.json data/tg-admin.json data/tg-invites.json data/tg-joins.json; do [ -f "$f" ] && git add "$f" || true; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "자동: 텔레그램 채널 기록"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
