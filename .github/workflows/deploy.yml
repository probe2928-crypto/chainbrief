name: 빌드 및 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"   # 15분마다 해외 헤드라인 갱신
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 헤드라인 캐시 복원
        uses: actions/cache@v4
        with:
          path: data
          key: news-${{ github.run_id }}
          restore-keys: news-

      - name: 해외 헤드라인 수집
        run: npm run news
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - id: pages
        uses: actions/configure-pages@v5

      - name: 사이트 빌드
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.origin }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
