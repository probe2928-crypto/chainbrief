name: 시그널 봇 배포

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/signals.yml"]

permissions:
  contents: write

concurrency:
  group: signals-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 로직 테스트
        run: node --no-warnings test/run.mjs > /dev/null && node --no-warnings test/subs.mjs > /dev/null && echo "테스트 통과"

      - name: 설정 확인
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare 키가 아직 없어서 배포를 건너뛰어요. docs/SIGNALS_SETUP.md 참고"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: wrangler 설치
        if: steps.cfg.outputs.skip != '1'
        run: npm i -g wrangler@4 --no-audit --no-fund

      - name: D1 데이터베이스 준비
        if: steps.cfg.outputs.skip != '1'
        run: |
          ID=$(wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(d=>d.name==="chainbrief-signals");console.log(x?x.uuid:"")})')
          if [ -z "$ID" ]; then
            wrangler d1 create chainbrief-signals > /dev/null
            ID=$(wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(d=>d.name==="chainbrief-signals");console.log(x?x.uuid:"")})')
          fi
          echo "D1: $ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          wrangler d1 execute chainbrief-signals --remote --file schema.sql -y

      - name: 채널·요금 설정 반영
        if: steps.cfg.outputs.skip != '1'
        env:
          V_KO: ${{ vars.TG_CHANNEL_KO || secrets.TG_CHANNEL_KO }}
          V_EN: ${{ vars.TG_CHANNEL_EN || secrets.TG_CHANNEL_EN }}
        run: |
          sed -i "s|__TG_CHANNEL_KO__|${V_KO:-__TG_CHANNEL_KO__}|; s|__TG_CHANNEL_EN__|${V_EN:-__TG_CHANNEL_EN__}|" wrangler.toml
          cat >> wrangler.toml <<EOF
          TG_PRO_KO = "${{ vars.TG_PRO_KO || secrets.TG_PRO_KO || '__' }}"
          TG_PRO_EN = "${{ vars.TG_PRO_EN || secrets.TG_PRO_EN || '__' }}"
          PAY_TRON_ADDRESS = "${{ vars.PAY_TRON_ADDRESS || secrets.PAY_TRON_ADDRESS || '__' }}"
          ADMIN_CHAT_ID = "${{ vars.ADMIN_CHAT_ID || secrets.ADMIN_CHAT_ID || '__' }}"
          PRICE_MONTH = "${{ vars.PRICE_MONTH || '19' }}"
          PRICE_QUARTER = "${{ vars.PRICE_QUARTER || '49' }}"
          FREE_DELAY_MIN = "${{ vars.FREE_DELAY_MIN || '15' }}"
          SUPPORT = "btcbullit"
          EOF
          sed -i 's/^          //' wrangler.toml
          cat wrangler.toml | grep -v PAY_TRON

      - name: 배포
        if: steps.cfg.outputs.skip != '1'
        id: deploy
        run: |
          wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Worker: $URL"

      - name: 비밀값 등록 (텔레그램·Etherscan·TronGrid)
        if: steps.cfg.outputs.skip != '1'
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
        run: |
          put() { if [ -n "$2" ]; then printf '%s' "$2" | wrangler secret put "$1" > /dev/null && echo "set $1"; fi; }
          put TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          put ETHERSCAN_API_KEY "$ETHERSCAN_API_KEY"
          put TRONGRID_API_KEY "$TRONGRID_API_KEY"
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then put TG_WEBHOOK_SECRET "$(printf '%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-32)"; fi

      - name: 텔레그램 봇 연결 (웹훅·메뉴)
        if: steps.cfg.outputs.skip != '1' && env.TELEGRAM_BOT_TOKEN != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          SEC=$(printf '%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-32)
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook" -d "url=$URL/tg/$SEC" -d 'allowed_updates=["message","callback_query"]' | head -c 200; echo
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setMyCommands" -H 'content-type: application/json' -d '{"commands":[{"command":"pro","description":"프로 구독 · Go Pro"},{"command":"status","description":"이용 상태 · My plan"},{"command":"lang","description":"언어 · Language"}]}' | head -c 100; echo
          BOT=$(curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getMe" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).result?.username||""))')
          echo "bot=$BOT" >> "$GITHUB_ENV"
          if [ -n "$BOT" ]; then printf 'BOT_USERNAME = "%s"\n' "$BOT" >> wrangler.toml; wrangler deploy > /dev/null && echo "bot @$BOT"; fi

      - name: 사이트 설정에 API 주소 기록
        if: steps.cfg.outputs.skip != '1' && steps.deploy.outputs.url != ''
        working-directory: .
        env:
          URL: ${{ steps.deploy.outputs.url }}
          V_KO: ${{ vars.TG_CHANNEL_KO || secrets.TG_CHANNEL_KO }}
          V_EN: ${{ vars.TG_CHANNEL_EN || secrets.TG_CHANNEL_EN }}
        run: |
          node -e '
            const fs=require("fs"),p="site.config.json",c=JSON.parse(fs.readFileSync(p,"utf8"));
            const s=c.signals||{}; const next={...s,api:process.env.URL,channelKo:process.env.V_KO||s.channelKo||"",channelEn:process.env.V_EN||s.channelEn||"",bot:process.env.bot||s.bot||""};
            if(JSON.stringify(next)!==JSON.stringify(s)){c.signals=next;fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n");console.log("updated")}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.config.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "자동: 시그널 API 주소 연결"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
