name: Pages 커스텀 도메인 설정
on:
  workflow_dispatch:
    inputs:
      cname: { description: "도메인 (비우면 해제)", required: false, default: "chainbrief.app" }
      https: { description: "HTTPS 강제 (true/false)", required: false, default: "false" }
permissions:
  pages: write
  contents: read
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", CN: "${{ github.event.inputs.cname }}", HT: "${{ github.event.inputs.https }}" }
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" -f cname="$CN" -F https_enforced="$HT" || gh api -X PUT "repos/${{ github.repository }}/pages" -f cname="$CN"
          gh api "repos/${{ github.repository }}/pages"
