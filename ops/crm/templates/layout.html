<!doctype html>
<html lang="{{html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light only">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:{{paper}};-webkit-text-size-adjust:100%;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:{{paper}};">
<tr><td align="center" style="padding:32px 16px;">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">
    <tr>
      <td style="padding:0 4px 20px 4px;font-family:Helvetica,Arial,sans-serif;font-size:22px;line-height:1;font-weight:800;letter-spacing:-0.02em;color:{{ink}};">{{wordmark}}</td>
      <td align="right" style="padding:0 4px 20px 4px;font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:{{muted}};">{{label}}</td>
    </tr>
    <tr><td colspan="2" style="background:{{card}};border:1px solid {{line}};border-radius:4px;padding:40px 36px 36px 36px;">
      {{ad_badge}}
      <h1 style="margin:0 0 20px 0;font-family:{{head_font}};font-size:30px;line-height:1.25;font-weight:700;letter-spacing:-0.01em;word-break:keep-all;color:{{ink}};">{{headline}}</h1>
      <div style="font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.7;word-break:keep-all;color:{{ink}};">{{body}}</div>
      {{cta}}
    </td></tr>
    <tr><td colspan="2" style="padding:24px 4px 0 4px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.65;word-break:keep-all;color:{{muted}};">{{legal}}</td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
