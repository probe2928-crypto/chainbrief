<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap');
*{margin:0;box-sizing:border-box}body{font-family:'Noto Sans KR',sans-serif;background:transparent}
.v{width:1080px;height:1920px;position:relative}
.panel{position:absolute;left:0;right:0;bottom:0;height:960px;background:rgba(158,27,50,.94);border-top:12px solid #C9A24A;padding:60px 70px;color:#fff}
.t{font-size:78px;font-weight:900;line-height:1.15;margin-bottom:46px}
.row{display:flex;align-items:center;gap:34px;margin-bottom:44px}
.n{width:96px;height:96px;border-radius:50%;background:#C9A24A;color:#9E1B32;font-size:64px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.sub,.all,.lab{white-space:nowrap}.sub{background:#fff;color:#111;border-radius:60px;padding:14px 56px;font-size:66px;font-weight:900}
.sub b{color:#E1131A}
.bell{width:110px;height:110px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.lab{font-size:66px;font-weight:900}
.all{background:#fff;color:#111;border-radius:22px;padding:10px 40px;font-size:62px;font-weight:900}
.arrow{font-size:80px;color:#C9A24A;font-weight:900}
.ai{position:absolute;right:50px;bottom:46px;background:#111;color:#fff;font-size:44px;font-weight:900;padding:10px 26px;border-radius:14px;border:4px solid #C9A24A}
.e{width:1280px;height:720px;position:relative;background:#9E1B32;color:#fff;padding:50px 60px;border:14px solid #C9A24A}
.e .t{font-size:84px;margin-bottom:34px}.e .row{margin-bottom:26px;gap:24px}.e .sub{font-size:58px;padding:12px 40px}.e .all{font-size:58px}
</style></head><body>
<div class="v" id="v"><div class="panel">
<div class="t">새 노래 알림,<br>이렇게 받으세요</div>
<div class="row"><div class="n">1</div><div class="sub"><b>빨간</b> 구독</div><div class="arrow">← 꾹!</div></div>
<div class="row"><div class="n">2</div><div class="bell"><svg width="70" height="70" viewBox="0 0 24 24"><path fill="#111" d="M12 22a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.8V3a1.5 1.5 0 0 0-3 0v1.2A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg></div><div class="lab">종 모양 누르기</div></div>
<div class="row"><div class="n">3</div><div class="all">전체</div><div class="lab">고르면 끝!</div></div>
<div class="ai">AI 가수 연화</div>
</div></div>
<div class="e" id="e">
<div class="t">또 듣고 싶으시면<br>구독·알림 꾹!</div>
<div class="row"><div class="n">1</div><div class="sub"><b>빨간</b> 구독</div><div class="n">2</div><div class="bell"><svg width="70" height="70" viewBox="0 0 24 24"><path fill="#111" d="M12 22a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.8V3a1.5 1.5 0 0 0-3 0v1.2A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg></div><div class="n">3</div><div class="all">전체</div></div>
<div class="ai">AI 가수 연화</div>
</div>
</body></html>
