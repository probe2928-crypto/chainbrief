<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:"Noto Sans CJK KR",sans-serif;background:#16121a}
#trio{width:1080px;height:1350px;position:relative;background:#16121a;color:#fff}
.head{height:205px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.head .ai{font-size:26px;font-weight:700;color:#16121a;background:#fff;padding:6px 20px;border-radius:30px}
.head h1{font-size:76px;font-weight:900;letter-spacing:.02em}
.row{height:282px;margin:0 40px 22px;border-radius:26px;position:relative;overflow:hidden;display:flex;align-items:center;padding:0 56px}
.row .no{font-size:150px;font-weight:900;opacity:.18;position:absolute;right:34px;bottom:-30px;line-height:1}
.row .name{font-size:120px;font-weight:900;width:330px;line-height:1}
.row .info{flex:1}
.row .who{font-size:44px;font-weight:700;line-height:1.3}
.row .song{margin-top:16px;display:inline-block;font-size:38px;font-weight:900;padding:6px 20px;border-radius:10px}
.yh{background:linear-gradient(110deg,#9E1B32,#6d0f22)}
.yh .name{font-family:"Noto Serif CJK KR",serif;color:#C9A24A}
.yh .song{background:#C9A24A;color:#4a0c18}
.bb{background:linear-gradient(110deg,#FF5C8A,#ff86a8)}
.bb .name{color:#fff;-webkit-text-stroke:6px #2b0a17;paint-order:stroke fill}
.bb .who{color:#2b0a17}
.bb .song{background:#3ED6B5;color:#2b0a17}
.hg{background:linear-gradient(110deg,#2F5D3A,#1f4128)}
.hg .name{color:#F2E6C9}
.hg .song{background:#F2E6C9;color:#1f4128}
.foot{position:absolute;left:40px;right:40px;bottom:46px;height:150px;border:4px solid #fff;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.foot b{font-size:52px;font-weight:900}
.foot span{font-size:28px;font-weight:500;opacity:.85;margin-top:8px}
</style></head><body>
<div id="trio">
  <div class="head"><div class="ai">AI 가상 가수 3인</div><h1>트롯스테이지 세 가수</h1></div>
  <div class="row yh"><div class="name">연화</div><div class="info"><div class="who">남해 항구 국밥집 딸<br>애절한 정통 트로트</div><div class="song">「엄마의 바다」</div></div><div class="no">01</div></div>
  <div class="row bb"><div class="name">봄비</div><div class="info"><div class="who">시장통 과일가게 막내딸<br>신나는 댄스 트로트</div><div class="song">「딱 내 스타일」</div></div><div class="no">02</div></div>
  <div class="row hg"><div class="name">한결</div><div class="info"><div class="who">경북 사과 과수원집 장남<br>누님들께 바치는 고백</div><div class="song">「당신이라서」</div></div><div class="no">03</div></div>
  <div class="foot"><b>신곡 메들리 11월 6일(금) 저녁 6시 30분</b><span>세 가수 모두 AI로 제작한 가상 가수입니다 · 유튜브 트롯스테이지</span></div>
</div>
</body></html>
