<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Bodoni;src:url(file:///tmp/gf/ofl/bodonimoda/BodoniModa[opsz,wght].ttf)}
@font-face{font-family:BodoniI;src:url(file:///tmp/gf/ofl/bodonimoda/BodoniModa-Italic[opsz,wght].ttf)}
@font-face{font-family:Jost;src:url(file:///tmp/gf/ofl/jost/Jost[wght].ttf)}
@font-face{font-family:SC;src:url(file:///tmp/gf/ofl/notoserifsc/NotoSerifSC[wght].ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff}
.c{position:relative;overflow:hidden;background:#F2EADF;color:#111}
.c::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 70% 0%,rgba(255,255,255,.55),transparent 60%),radial-gradient(ellipse at 10% 110%,rgba(176,138,74,.10),transparent 55%)}
.wm{font-family:Bodoni;font-variation-settings:"opsz" 11;font-weight:500;letter-spacing:.32em;text-indent:.32em}
.tag{font-family:Jost;font-weight:400;letter-spacing:.32em;text-transform:uppercase;color:#5A544B}
.red{color:#B3211C}
.dot{display:inline-block;border-radius:50%;background:#B3211C}
.it{font-family:BodoniI;font-variation-settings:"opsz" 28;font-weight:500}
.rule{height:1px;background:#111;opacity:.75}
/* profile */
#p{width:1080px;height:1080px;display:flex;align-items:center;justify-content:center}
#p .C{font-family:BodoniI;font-variation-settings:"opsz" 96;font-weight:400;font-size:700px;line-height:1;position:relative;left:-70px;top:-20px}
#p .dot{width:64px;height:64px;position:absolute;left:728px;top:713px}
/* fb cover 1640x624 */
#fb{width:1640px;height:624px}
#fb .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#fb .top{font-size:19px;margin-bottom:26px}
#fb .wm{font-size:92px}
#fb .rule{width:220px;margin:30px 0 26px}
#fb .h{font-family:Bodoni;font-variation-settings:"opsz" 28;font-weight:500;font-size:46px;letter-spacing:-.01em}
#fb .sub{font-size:17px;margin-top:24px}
#fb .sub b{font-family:SC;font-weight:500;letter-spacing:.2em}
/* x header 1500x500 */
#x{width:1500px;height:500px}
#x .in{position:absolute;left:520px;right:110px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
#x .top{font-size:16px;margin-bottom:20px}
#x .wm{font-size:66px;text-indent:0}
#x .rule{width:160px;margin:24px 0 20px}
#x .h{font-family:Bodoni;font-variation-settings:"opsz" 28;font-weight:500;font-size:40px}
#x .sub{font-size:15px;margin-top:18px}
#x .sub b{font-family:SC;font-weight:500;letter-spacing:.2em}
</style></head><body>
<div id="p" class="c"><span class="C">C</span><span class="dot"></span></div>
<div id="fb" class="c"><div class="in">
 <div class="tag top"><span class="dot" style="width:9px;height:9px;margin-right:12px;vertical-align:middle"></span>Live · 24/7 · Global</div>
 <div class="wm">CHAINBRIEF</div>
 <div class="rule"></div>
 <div class="h">Blockchain news, <span class="it red">briefed.</span></div>
 <div class="tag sub">Breaking news · Analysis · Markets &nbsp;—&nbsp; English · <b>中文</b></div>
</div></div>
<div id="x" class="c"><div class="in">
 <div class="tag top"><span class="dot" style="width:8px;height:8px;margin-right:11px;vertical-align:middle"></span>Live · 24/7 · Global</div>
 <div class="wm">CHAINBRIEF</div>
 <div class="rule"></div>
 <div class="h">Blockchain news, <span class="it red">briefed.</span></div>
 <div class="tag sub">Breaking · Analysis · Markets &nbsp;—&nbsp; English · <b>中文</b></div>
</div></div>
</body></html>
